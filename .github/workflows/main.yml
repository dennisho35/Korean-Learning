name: Build Android APK & AAB (Korean Step-by-Step)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Flutter Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify project & generate platform scaffolding if needed
        run: |
          flutter create . --project-name korean_step_by_step --org com.stepbystep.korean
          flutter pub get
          flutter test

      - name: Build Release APK (split-per-abi & universal)
        run: |
          flutter build apk --release

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korean-Step-By-Step-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
