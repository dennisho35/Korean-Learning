name: Build Android APK & AAB (Korean Step-by-Step)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Flutter Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & generate fresh Android/iOS platform scaffolding
        run: |
          rm -rf android ios test/widget_test.dart
          flutter create . --project-name korean_step_by_step --org com.stepbystep.korean --platforms android,ios
          rm -f test/widget_test.dart
          sed -i 's/android:label="korean_step_by_step"/android:label="韓語一步通"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korean-Step-By-Step-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
